name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ea27-muhasebe]
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: X-ERP-Windows
          path: release/*.exe
          if-no-files-found: error
